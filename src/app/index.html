<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortik</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="nav-bar">
      <h1>
        Shortik
        <span class="subtitle">Կարճ հոլովակների #1 հարթակը 🦉</span>
      </h1>
      <button id="logout-button">Դուրս գալ</button>
    </div>

    <div id="auth-section">
      <h2>Մուտք</h2>
      <form id="login-form">
        <input
          class="input-area"
          type="email"
          id="email"
          placeholder="Email"
          required
        />
        <input
          class="input-area"
          type="password"
          id="password"
          placeholder="Գաղտնաբառ"
          required
        />
        <div class="button-container">
          <button type="submit">Մուտք գործել</button>
          <button id="signup-button" type="button">Գրանցվել (Signup)</button>
        </div>
      </form>
    </div>

    <div id="video-section" style="display: none">
      <h2>Ստեղծել draft</h2>
      <form id="video-draft-form">
        <input
          class="input-area"
          type="text"
          id="video-title"
          placeholder="Հոլովակի վերնագիր"
          required
        />
        <textarea
          class="input-area"
          id="video-description"
          placeholder="Հոլովակի նկարագրություն"
          required
        ></textarea>
        <div class="button-container">
          <button type="submit">Ստեղծել draft</button>
        </div>
      </form>
      <h2>Բոլոր հոլովակները</h2>
      <ul id="video-list"></ul>

      <div id="video-display" style="display: none">
        <h2>Ընթացիկ հոլովակը՝ <span id="video-title-display"></span></h2>
        <p id="video-description-display"></p>

        <div class="button-container mb-4">
          <button id="delete-video">Ջնջել հոլովակը</button>
        </div>

        <div id="video-upload-forms">
          <form
            id="thumbnail-upload-form"
          >
            <h3>Թարմացնել thumbnail-ը</h3>
            <input
              type="file"
              id="thumbnail"
              accept="image/*,application/pdf"
              required
            />
            <button type="submit" id="upload-thumbnail-btn">Վերբեռնել</button>
            <img id="thumbnail-image" style="display: block" />
          </form>

          <div id="video-container">
            <form
              id="video-file-upload-form"
            >
              <h3>Թարմացնել հոլովակի ֆայլը</h3>
              <input type="file" id="video-file" accept="video/*" required />
              <button type="submit" id="upload-video-btn">Վերբեռնել</button>
            </form>
            <video id="video-player" controls style="display: block"></video>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
